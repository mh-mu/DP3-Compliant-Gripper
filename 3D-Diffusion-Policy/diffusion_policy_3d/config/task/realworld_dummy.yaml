name: real_world_dummy

task_name: real_world_dummy

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    wrist_img:
      shape: [3, 480, 640]
      type: rgb
    force:
      shape: [2]
      type: low_dimx
    state:
      shape: [2]
      type: low_dimx
  action:
    shape: [2]

env_runner: null

